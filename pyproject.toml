[project]
name = "hamtayar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.6,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "uvicorn[standard]>=0.30,<1"]
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]
[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["infra*", "test*"]
